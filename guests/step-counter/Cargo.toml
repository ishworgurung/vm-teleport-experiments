[package]
name = "step-counter"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# The guests are outside the root workspace, so they repeat its lint table.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
panic = "abort"
