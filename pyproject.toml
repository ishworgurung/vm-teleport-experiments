# Python here is test and orchestration code: the checkers, the mutation sweep,
# and the small server and client of the network experiment. There is no
# package to install. `make lint` runs ruff and pyright with this config.
[project]
name = "vm-teleport-experiments"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "COM812", # conflicts with the formatter
  "T201",   # print() is how these scripts report
  "S603",   # subprocess with a list of arguments, never a shell string
  "S607",   # the tools are found on PATH on purpose
  "S101",   # assert states an invariant in a checker
  "CPY001", # no copyright header in each file: the licence is in LICENSE
  "INP001", # scripts/ is a directory of scripts, not a package
]

[tool.ruff.lint.per-file-ignores]
"scripts/net/server.py" = ["S104"]  # the VIP run binds the test server to the private link

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["scripts"]
