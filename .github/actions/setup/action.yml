# Everything the experiments need on a GitHub-hosted Ubuntu runner: QEMU and the
# UEFI firmware, access to /dev/kvm, Rust with the three targets, zig, the
# pinned build tools and the three Debian images. Used by both jobs of
# experiments.yml.
name: Set up the experiments
description: Install the host-side requirements (see `make doctor`) and download the pinned tools and VM images.

runs:
  using: composite
  steps:
    - name: Free disk space (the images, three Rust targets and CPython need about 10 GB)
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install QEMU, firmware and the other host tools
      shell: bash
      run: |
        sudo apt-get update -q
        # Ubuntu 26.04 split RISC-V out of qemu-system-misc into its own package, qemu-system-riscv.
        riscv=; apt-cache show qemu-system-riscv > /dev/null 2>&1 && riscv=qemu-system-riscv
        sudo apt-get install -y -q --no-install-recommends $riscv \
          qemu-system-x86 qemu-system-arm qemu-system-misc qemu-utils \
          qemu-efi-aarch64 qemu-efi-riscv64 \
          genisoimage rsync openssl xz-utils openssh-client curl git make python3
        ls -l "$ARM_FW_CODE" "$ARM_FW_VARS" "$RISCV_FW_CODE" "$RISCV_FW_VARS"

    # Linux runners expose /dev/kvm but only to root. Open it for everyone, as
    # QEMU runs as the runner user. If there is no KVM at all (a runner without
    # nested virtualisation), fall back to emulating h1, h4 and h5 as well.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm || true
        if [[ -r /dev/kvm && -w /dev/kvm ]]; then
          echo "KVM is usable"
        else
          echo "::warning::no /dev/kvm on this runner: h1, h4 and h5 fall back to TCG emulation (much slower)"
          printf '%s\n' H1_ACCEL=tcg H4_ACCEL=tcg H5_ACCEL=tcg >> "$GITHUB_ENV"
        fi

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0 # the same as rust-toolchain.toml
        targets: wasm32-wasip1,aarch64-unknown-linux-musl,riscv64gc-unknown-linux-gnu
    - uses: Swatinem/rust-cache@v2
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - uses: actions/cache@v4
      with:
        path: |
          tools/wasmtime
          tools/binaryen
          tools/wasi-sdk
          tools/wasmer
        key: tools-${{ hashFiles('tools/fetch-tools.sh') }}
    - name: Download the pinned tools and the Debian images
      shell: bash
      run: make tools images

    - name: make doctor
      shell: bash
      run: make doctor
