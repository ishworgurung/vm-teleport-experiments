# Run every experiment on GitHub's free hosted runners, and compare each
# outcome (the lines after RESULT) with the transcript recorded in results/.
#
# The experiments boot QEMU VMs: h1, h4 and h5 on KVM, h2 (Arm) and h3 (RISC-V)
# emulated. That wants the 4-core, 16 GB runner that public repositories get
# for free. It is split in two jobs that run side by side, so that each fits
# the runner and the emulated VMs do not fight for its cores:
#   wasm  experiments 1 to 3, 5a and the cross-check (all four hosts)
#   criu  experiments 4, 5b, 5c, 6a and 6b          (h1, h2, h4 and h5)
# `make mutate` (a test-quality tool, not an experiment) is not run here.
name: experiments

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  push:
    branches: [main]
    paths:
      - crates/**
      - guests/**
      - scripts/**
      - tools/**
      - vms/**
      - Makefile
      - Cargo.*
      - .cargo/**
      - .github/**

permissions:
  contents: read

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Where Ubuntu's qemu-efi-* packages put the firmware (the defaults are Arch's).
  ARM_FW_CODE: /usr/share/AAVMF/AAVMF_CODE.fd
  ARM_FW_VARS: /usr/share/AAVMF/AAVMF_VARS.fd
  RISCV_FW_CODE: /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd
  RISCV_FW_VARS: /usr/share/qemu-efi-riscv64/RISCV_VIRT_VARS.fd

jobs:
  wasm:
    name: Wasm experiments on four hosts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Each target builds and boots what it needs first (see the Makefile).
      - name: Tests, and a run on this machine (no VMs)
        run: make test run
      - name: Experiments 0 to 3
        run: make hosts demo-step demo-async demo-py
      - name: Experiment 3b, the cross-check
        run: make crosscheck
      - name: Experiment 5a, network state of a Wasm program
        run: make demo-net

      - name: Compare the outcomes with the recorded ones
        if: ${{ !cancelled() }}
        run: |
          scripts/compare-results.sh results/hosts.txt results/demo-step.txt results/demo-async.txt \
            results/demo-py.txt results/crosscheck.txt results/demo-net.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the transcripts and VM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-results
          path: |
            results/
            vms/run/*.log
            build/net/server.log
          if-no-files-found: warn
      - name: Power the VMs off
        if: ${{ always() }}
        run: make down

  criu:
    name: CRIU and floating-IP experiments
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Each target builds and boots what it needs first (see the Makefile).
      - name: Experiment 4, CRIU across CPUs (reboots h4 three times)
        run: make criu
      - name: Experiments 5b and 5c, CRIU with an open connection
        run: make criu-net criu-net-probe
      - name: Experiments 6a and 6b, floating IP (reboots h1 and h4 with a private link, boots h5)
        run: make vip-check criu-vip

      - name: Compare the outcomes with the recorded ones
        if: ${{ !cancelled() }}
        run: |
          scripts/compare-results.sh results/criu/*.txt results/criu-net.txt results/criu-net-probe.txt \
            results/vip-check.txt results/criu-vip.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the transcripts and VM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: criu-results
          path: |
            results/
            vms/run/*.log
            build/net/server.log
          if-no-files-found: warn
      - name: Power the VMs off
        if: ${{ always() }}
        run: make down
