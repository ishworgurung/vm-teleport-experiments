# Lint and build everything, and run the host's tests. The experiments need
# VMs, so they are not run here: their recorded output is in results/.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rustfmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0 # the same as rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # `make guests` fetches the pinned tools itself, and builds the native CRIU
      # guest with zig (the cross C compiler, see tools/zcc-*).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: make lint-rust
      - name: Build the guests and run the host's tests
        run: make guests test

  build:
    name: build tc for three ISAs, the guests and CPython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0 # the same as rust-toolchain.toml
          targets: wasm32-wasip1,aarch64-unknown-linux-musl,riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: make host guests python

  python:
    name: ruff and pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make lint-py

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint-sh

  markdown:
    name: markdownlint and Mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make lint-md
